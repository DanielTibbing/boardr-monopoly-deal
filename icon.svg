<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3b2a"/><stop offset="1" stop-color="#0d150f"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- three property-set cards fanned -->
  <g transform="rotate(-16 40 74)"><rect x="18" y="40" width="34" height="52" rx="5" fill="#d0342c"/><rect x="18" y="40" width="34" height="12" rx="5" fill="#a5271f"/></g>
  <g transform="rotate(0 64 70)"><rect x="47" y="34" width="34" height="54" rx="5" fill="#2f4fae"/><rect x="47" y="34" width="34" height="12" rx="5" fill="#233a83"/></g>
  <g transform="rotate(16 90 74)"><rect x="76" y="40" width="34" height="52" rx="5" fill="#e8c33a"/><rect x="76" y="40" width="34" height="12" rx="5" fill="#c39f22"/></g>
  <!-- coin -->
  <circle cx="64" cy="30" r="15" fill="#f2b13d" stroke="#231602" stroke-width="2"/>
  <text x="64" y="36" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#231602">$</text>
</svg>
